[package]
name = "backend-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7.5", features = ["macros", "multipart", "ws"] }
futures-util = "0.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
rand = "0.8"
rust_xlsxwriter = "0.64"

# Tracing & Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Database (PostgreSQL)
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

# Time & UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

# Security & Hashing
jsonwebtoken = "9.3"
bcrypt = "0.15"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"

# Environment & Errors
dotenvy = "0.15"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.13.5", features = ["json"] }
base64 = "0.22"
urlencoding = "2.1"
cron = "0.17.0"
