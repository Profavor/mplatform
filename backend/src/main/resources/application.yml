server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-sec: ${JWT_ACCESS_EXPIRATION_SEC:1800}
  refresh-token-expiration-sec: ${JWT_REFRESH_EXPIRATION_SEC:172800}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.classification.domain_system.integration.DataMappingTransformer: DEBUG

security:
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY}

mdm:
  matching:
    fuzzy-max-candidates: 500
    fuzzy-max-pages: 10
    feedback-precision-threshold: 0.95
    feedback-score-increment: 0.02
  dq:
    system-user-id: SYSTEM
    trend-window-days: 30
  merge:
    default_source-priority: 999

chat:
  retention-days: ${CHAT_RETENTION_DAYS:7}

