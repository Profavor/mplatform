server:
  port: ${PORT}

spring:
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/realms/mplatform/protocol/openid-connect/certs}
    keycloak:
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/mplatform/protocol/openid-connect/token}
      client-id: ${KEYCLOAK_CLIENT_ID:mdm-frontend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  opensearch:
    uris: ${OPENSEARCH_URIS}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: domain-system-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_SMTP_HOST:localhost}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_ADMIN_USER:admin@mplatform.com}
    password: ${MAIL_ADMIN_PASSWORD:AdminMailPass123!}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
            trust: "*"
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        imap:
          ssl:
            enable: true
            trust: "*"

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:mplatform}
  admin-username: ${KEYCLOAK_ADMIN:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

dq:
  engine:
    custom-spel:
      enabled: ${DQ_ENGINE_CUSTOM_SPEL_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-sec: ${JWT_ACCESS_EXPIRATION_SEC:1800}
  refresh-token-expiration-sec: ${JWT_REFRESH_EXPIRATION_SEC:172800}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  upload:
    allowed-extensions: ${FILE_UPLOAD_ALLOWED_EXTENSIONS:jpg,jpeg,png,gif,pdf,xlsx,xls,csv,docx,doc,pptx,ppt,txt,zip}

logging:
  level:
    com.classification.domain_system.integration.DataMappingTransformer: DEBUG

security:
  encryption:
    type: ${ENCRYPTION_TYPE:LOCAL}
    secret-key: ${ENCRYPTION_SECRET_KEY:default-vault-local-fallback-key-32bytes}
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      auth-method: ${VAULT_AUTH_METHOD:TOKEN}
      token: ${VAULT_TOKEN:root}
      k8s-role: ${VAULT_K8S_ROLE:mdm-role}
      k8s-jwt-path: ${VAULT_K8S_JWT_PATH:/var/run/secrets/kubernetes.io/serviceaccount/token}
      key-name: ${VAULT_KEY_NAME:mdm-field-key}

mdm:
  matching:
    fuzzy-max-candidates: 500
    fuzzy-max-pages: 10
    feedback-precision-threshold: 0.95
    feedback-score-increment: 0.02
  dq:
    system-user-id: SYSTEM
    trend-window-days: 30
  merge:
    default_source-priority: 999

chat:
  retention-days: ${CHAT_RETENTION_DAYS}

mail:
  domain: ${MAIL_DOMAIN:mplatform.com}
  imap:
    enabled: ${MAIL_IMAP_ENABLED:true}
    host: ${MAIL_IMAP_HOST:localhost}
    port: ${MAIL_IMAP_PORT:993}
    username: ${MAIL_ADMIN_USER:admin@mplatform.com}
    password: ${MAIL_ADMIN_PASSWORD:AdminMailPass123!}
  account:
    auto-create: ${MAIL_ACCOUNT_AUTO_CREATE:true}
    config-path: ${MAIL_CONFIG_PATH:./docker-data/dms/config}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: domain-system

storage:
  type: ${STORAGE_TYPE}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

integration:
  jdbc:
    pool:
      maximum-pool-size: ${INTEGRATION_JDBC_MAX_POOL_SIZE:5}
      connection-timeout: ${INTEGRATION_JDBC_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${INTEGRATION_JDBC_VALIDATION_TIMEOUT:3000}
      max-lifetime: ${INTEGRATION_JDBC_MAX_LIFETIME:600000}
  webservice:
    connect-timeout-ms: ${INTEGRATION_WEBSERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${INTEGRATION_WEBSERVICE_READ_TIMEOUT_MS:10000}
  scheduler:
    pool-size: ${INTEGRATION_SCHEDULER_POOL_SIZE:4}
