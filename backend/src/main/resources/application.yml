server:
  port: ${PORT}

spring:
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
    keycloak:
      token-uri: ${KEYCLOAK_TOKEN_URI}
      client-id: ${KEYCLOAK_CLIENT_ID}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  opensearch:
    uris: ${OPENSEARCH_URIS}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: domain-system-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:myrealm}
  admin-username: ${KEYCLOAK_ADMIN}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  access-token-expiration-sec: ${JWT_ACCESS_EXPIRATION_SEC}
  refresh-token-expiration-sec: ${JWT_REFRESH_EXPIRATION_SEC}

file:
  upload-dir: ${FILE_UPLOAD_DIR}

logging:
  level:
    com.classification.domain_system.integration.DataMappingTransformer: DEBUG

security:
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY}

mdm:
  matching:
    fuzzy-max-candidates: 500
    fuzzy-max-pages: 10
    feedback-precision-threshold: 0.95
    feedback-score-increment: 0.02
  dq:
    system-user-id: SYSTEM
    trend-window-days: 30
  merge:
    default_source-priority: 999

chat:
  retention-days: ${CHAT_RETENTION_DAYS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: domain-system

storage:
  type: ${STORAGE_TYPE}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
