spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
  datasource:
    url: jdbc:h2:file:./data/mplatform;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: postgres
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect


jwt:
  secret: ${JWT_SECRET:my-secret-key-that-is-at-least-32-bytes-long}
  expiration: ${JWT_EXPIRATION:86400000}
  access-token-expiration-sec: ${JWT_ACCESS_EXPIRATION_SEC:1800}
  refresh-token-expiration-sec: ${JWT_REFRESH_EXPIRATION_SEC:172800}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

security:
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:my-secret-key-that-is-at-least-32-bytes-long}

mdm:
  matching:
    fuzzy-max-candidates: 500
    fuzzy-max-pages: 10
    feedback-precision-threshold: 0.95
    feedback-score-increment: 0.02
  dq:
    system-user-id: SYSTEM
    trend-window-days: 30
  merge:
    default_source-priority: 999

chat:
  retention-days: ${CHAT_RETENTION_DAYS:7}
