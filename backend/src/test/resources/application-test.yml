spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         # issuer-uri: http://localhost:8080/realms/mplatform
  #         # jwk-set-uri: http://localhost:8080/realms/mplatform/protocol/openid-connect/certs

opensearch:
  uris: http://localhost:9200

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

keycloak:
  server-url: http://localhost:8080
  realm: testrealm
  admin-client-id: test-client
  admin-client-secret: test-secret

