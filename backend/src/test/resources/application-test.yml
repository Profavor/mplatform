spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/dummy-jwk-set-uri
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple
  opensearch:
    uris: http://localhost:9200
  integration:
    jdbc:
      initialize-schema: never
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.integration.IntegrationAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.micrometer.metrics.autoconfigure.system.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration

management:
  metrics:
    enable:
      process: false
      system: false
      jvm: false

keycloak:
  server-url: http://localhost:8080
  realm: testrealm
  admin-username: dummy-admin
  admin-password: dummy-password

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret: test-secret-test-secret-test-secret-test-secret
  access-token-expiration-sec: 1800
  refresh-token-expiration-sec: 172800

chat:
  retention-days: 7

storage:
  type: local
  local:
    dir: ./uploads

dq:
  engine:
    custom-spel:
      enabled: true
