apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mdm-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/version: "1.2.36"
        version: "1.2.36"
    spec:
      containers:
      - name: backend
        image: profavor2/mplatform-backend:1.2.36
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 8
        envFrom:
        - configMapRef:
            name: mdm-config
        - secretRef:
            name: mdm-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xms4g -Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC"
        - name: PORT
          value: "8080"
        - name: MAIL_CONFIG_PATH
          value: "/var/mail-config"
        volumeMounts:
        - name: mail-config
          mountPath: /var/mail-config
      volumes:
      - name: mail-config
        persistentVolumeClaim:
          claimName: mail-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mdm-system
spec:
  ports:
  - port: 8080
  selector:
    app: backend
