apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mdm-system
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: mplatform-backend:v57
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: mdm-config
        - secretRef:
            name: mdm-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xms4g -Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC"
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mdm-system
spec:
  ports:
  - port: 8080
  selector:
    app: backend
