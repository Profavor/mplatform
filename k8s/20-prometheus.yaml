apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mdm-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'mdm-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['backend:8080']
            labels:
              application: 'domain-system'
              environment: 'kubernetes'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mdm-system
spec:
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mdm-system
spec:
  ports:
  - port: 9090
  selector:
    app: prometheus
