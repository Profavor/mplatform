apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mdm-ingress
  namespace: mdm-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  tls:
  - hosts:
    - mplatform.local
    secretName: mplatform-tls-secret
  rules:
  - host: mplatform.local
    http:
      paths:
      - path: /auth/keycloak
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /auth/realms
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /auth/admin
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /auth/resources
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /auth/js
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /api/_auth
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /ws-stomp
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
