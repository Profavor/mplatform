apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mdm-system
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/version: "1.5.66"
    version: "1.5.66"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/version: "1.5.66"
        version: "1.5.66"
    spec:
      hostAliases:
      - ip: "10.100.179.117"
        hostnames:
        - "mplatform.local"
      containers:
      - name: frontend
        image: profavor2/mplatform-frontend:1.5.66
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        env:
        - name: NUXT_OIDC_PROVIDERS_KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mdm-secrets
              key: KEYCLOAK_CLIENT_SECRET
        envFrom:
        - configMapRef:
            name: mdm-config
        - secretRef:
            name: mdm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mdm-system
spec:
  ports:
  - port: 3000
  selector:
    app: frontend
