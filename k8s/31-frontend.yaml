apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mdm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      hostAliases:
      - ip: "10.103.242.160"
        hostnames:
        - "mplatform.local"
      containers:
      - name: frontend
        image: mplatform-frontend:v63
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: mdm-config
        - secretRef:
            name: mdm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mdm-system
spec:
  ports:
  - port: 3000
  selector:
    app: frontend
