apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mdm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      hostAliases:
      - ip: "10.103.242.160"
        hostnames:
        - "mplatform.local"
      containers:
      - name: frontend
        image: mplatform-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: OAUTH2_ISSUER_URI
          value: "http://mplatform.local/auth/realms/mplatform"
        - name: KEYCLOAK_REDIRECT_URI
          value: "http://mplatform.local/auth/keycloak/callback"
        # Nuxt 3 requires this variable to hit the backend API
        - name: NUXT_PUBLIC_API_BASE
          value: "http://mplatform.local/api"
        # Node environment for Nuxt SSR
        - name: NODE_ENV
          value: "production"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mdm-system
spec:
  ports:
  - port: 3000
  selector:
    app: frontend
