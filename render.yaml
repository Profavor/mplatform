services:
  # Backend Web Service (Spring Boot Docker)
  - type: web
    name: mplatform-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_SECRET_KEY
        sync: false

  # Frontend Web Service (Nuxt 3 Node 24 SSR Docker)
  - type: web
    name: mplatform-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: API_BASE_URL
        sync: false
      - key: NUXT_PUBLIC_API_BASE
        sync: false
      - key: NUXT_SESSION_PASSWORD
        sync: false
