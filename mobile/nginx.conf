server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/wasm;

    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    location = / {
        return 301 /mobile/$is_args$args;
    }

    location = /mobile {
        return 301 /mobile/$is_args$args;
    }

    location /mobile/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
