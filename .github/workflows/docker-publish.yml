name: Build & Publish Docker Images

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker Image Tag (e.g. v1.0.0, dev, latest)'
        required: true
        default: 'latest'
      target:
        description: 'Target component to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - mobile
      push_images:
        description: 'Push images to registry'
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image_name: mplatform-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            image_name: mplatform-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: mobile
            image_name: mplatform-mobile
            context: ./mobile
            dockerfile: ./mobile/Dockerfile

    steps:
      - name: Check if service should run
        id: check_run
        run: |
          if [ "${{ github.event.inputs.target }}" != "" ] && [ "${{ github.event.inputs.target }}" != "all" ] && [ "${{ github.event.inputs.target }}" != "${{ matrix.service }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check_run.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.check_run.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_run.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: steps.check_run.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.check_run.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event.inputs.tag == 'latest' }}

      - name: Build and push Docker image
        if: steps.check_run.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
