name: MDM System CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: domain_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: domain_system_test
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JWT_SECRET: ci-test-secret-key-for-jwt-authentication-over-256-bits
      JWT_EXPIRATION: 86400000
      JWT_ACCESS_EXPIRATION_SEC: 1800
      JWT_REFRESH_EXPIRATION_SEC: 172800
      ENCRYPTION_SECRET_KEY: ci-test-encryption-key-which-must-be-at-least-256-bits-long
      FILE_UPLOAD_DIR: ./uploads
      PORT: 8080
      SPRING_PROFILES_ACTIVE: test
      DDL_AUTO: create-drop
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      OPENSEARCH_URIS: http://localhost:9200
      OAUTH2_ISSUER_URI: http://localhost:8080/realms/mplatform
      CHAT_RETENTION_DAYS: 7
      STORAGE_TYPE: local
      MINIO_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: test-bucket

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Make mvnw executable
      run: chmod +x mvnw

    - name: Run Unit Tests
      run: ./mvnw clean test --file pom.xml -B

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Unit Tests
      run: npm run test

    - name: Build
      run: npm run build
